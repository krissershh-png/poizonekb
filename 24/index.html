<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Китай: первые 24 часа — Крис про Китай</title>
<meta name="theme-color" content="#c81717">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Golos+Text:wght@400;500;600;700;800&family=Caveat:wght@700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
/* стили экранов телефона и фирменные токены — из guide.html */

:root{
  --red:#c81717;--red-2:#e02a2a;--ink:#121212;--ink-2:#3d3535;--mute:#7a6f6f;
  --line:#efe6e6;--bg:#f8f5f5;--pink:#fdf2f2;--pink-2:#f7dede;
  --jade:#16804a;--jade-soft:#e2f4ea;--sky:#2f6fed;--sky-soft:#e8effd;
  --ali:#1677ff;--wx:#07c160;--didi:#ff7a1a;
  --dela:Unbounded,"Noto Sans SC","Arial Black",sans-serif;
  --body:"Golos Text","Noto Sans SC","Segoe UI",Arial,sans-serif;
  --hand:Caveat,cursive;
  --cn:"Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:A4;margin:0}
html,body{background:#ddd}
body{font-family:var(--body);color:var(--ink);font-size:14.4px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;padding:13mm 14mm 15mm;margin:0 auto 10px;page-break-after:always;break-after:page;display:flex;flex-direction:column}
@media print{html,body{background:#fff}.page{margin:0}}
b,strong{font-weight:700;color:var(--ink)}
.cn{font-family:var(--cn)}
.r{color:var(--red)}
.mute{color:var(--mute)}

/* header / footer */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9mm}
.brand{font-family:var(--dela);font-weight:900;font-size:10.5px;letter-spacing:.02em;line-height:1}
.brand .r{margin-right:4px}
.sec{font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sec i{font-style:normal;color:var(--red);margin:0 5px}
.pn{position:absolute;right:14mm;bottom:8mm;font-family:var(--dela);font-weight:800;font-size:11px;color:var(--red)}
.pn-l{position:absolute;left:14mm;bottom:8mm;font-size:9.5px;color:var(--mute);font-weight:600}

/* type */
.kick{font-family:var(--hand);font-size:32px;line-height:.9;color:var(--red);margin-bottom:2px}
h1{font-family:var(--dela);font-weight:900;font-size:32px;line-height:1.08;text-transform:uppercase;letter-spacing:-.01em}
h1 .r{color:var(--red)}
h2{font-family:var(--dela);font-weight:800;font-size:15.5px;text-transform:uppercase;line-height:1.2;margin-bottom:6px}
h3{font-family:var(--dela);font-weight:800;font-size:12.5px;text-transform:uppercase;line-height:1.25;margin-bottom:4px}
.lead{font-size:15.4px;font-weight:500;color:var(--ink-2);margin-top:9px;max-width:165mm}
.lead b{color:var(--ink)}
p+p{margin-top:6px}
.small{font-size:12.8px}
.xs{font-size:11.6px;line-height:1.4}
.gap{height:12px}.gap-s{height:7px}.gap-l{height:18px}
.grow{flex:1}

/* cards */
.card{border-radius:18px;background:#fff;box-shadow:0 0 0 1.5px var(--line),0 8px 20px rgba(18,18,18,.05);padding:13px 15px}
.card.pink{background:var(--pink);box-shadow:0 0 0 1.5px var(--pink-2)}
.card.soft{background:var(--bg);box-shadow:none}
.card.dark{background:var(--ink);color:#fff;box-shadow:none}
.card.dark b,.card.dark strong{color:#fff}
.card.red{background:var(--red);color:#fff;box-shadow:none}
.card.red b{color:#fff}
.card.jade{background:var(--jade-soft);box-shadow:none}
.card.line{box-shadow:0 0 0 2px var(--ink)}
.torn{padding-bottom:20px;-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x}
.dash{border:0;border-top:2px dashed #dccfcf;margin:9px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{display:flex;gap:10px;align-items:flex-start}

/* callouts */
.note{position:relative;border-radius:18px;padding:17px 15px 12px;box-shadow:0 0 0 1.8px var(--red);margin-top:14px;background:#fff}
.note .t{position:absolute;top:-10px;left:14px;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px 3px;border-radius:999px}
.note.ink{box-shadow:0 0 0 1.8px var(--ink)}
.note.ink .t{background:var(--ink)}
.note.fill{background:var(--pink);box-shadow:none}
.note.warn .t::before{content:"! "}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-weight:800;font-size:11.5px;background:var(--ink);color:#fff;white-space:nowrap}
.pill.o{background:#fff;color:var(--ink);box-shadow:0 0 0 1.8px var(--ink)}
.pill.red{background:var(--red)}
.pill.soft{background:var(--pink);color:var(--red)}
.pill.g{background:var(--jade-soft);color:var(--jade)}

/* kris tip */
.kris{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.kris .ava{flex:0 0 52px;height:52px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px var(--red);background:#fff}
.kris .ava img{width:100%;height:100%;object-fit:cover;object-position:52% 14%;transform:scale(1.9);transform-origin:52% 24%}
.kris .bub{flex:1;background:var(--pink);border-radius:4px 18px 18px 18px;padding:9px 14px 10px}
.kris .bub .h{font-family:var(--hand);font-size:24px;color:var(--red);line-height:1;margin-bottom:2px}

/* numbered steps */
.n{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:9.5px;line-height:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--red);vertical-align:middle}
.steps{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.8px;line-height:1.45}
.steps li .n{margin-top:1px}
.steps.big li{font-size:14.6px}

/* phones */
.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.phones.two{grid-template-columns:repeat(2,52mm);justify-content:center;gap:26px}
.pcap{font-family:var(--dela);font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;color:var(--ink)}
.pcap .r{color:var(--red)}
.ph{background:var(--ink);border-radius:26px;padding:6px;box-shadow:0 10px 24px rgba(18,18,18,.14)}
.scr{background:#f6f7f9;border-radius:21px;height:100mm;overflow:hidden;position:relative;font-size:9.6px;line-height:1.35;color:#1b1b1f;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:7px 14px 3px;font-weight:700;font-size:8.5px}
.nav{padding:4px 11px 7px;font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px}
.nav .bk{color:#888;font-size:13px;line-height:1}
.pbody{padding:2px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pt{font-weight:800;font-size:13px;line-height:1.15}
.ps{color:#8a8f98;font-size:8.6px}
.in{background:#fff;border-radius:9px;padding:7px 9px;box-shadow:0 0 0 1px #e3e5ea;display:flex;justify-content:space-between;align-items:center;gap:4px}
.in.on{box-shadow:0 0 0 1.6px var(--ali)}
.lb{color:#8a8f98;font-size:8.2px}
.bt{border-radius:9px;padding:7px 8px;text-align:center;font-weight:800;color:#fff;background:var(--ali);font-size:10px;display:flex;justify-content:center;align-items:center;gap:6px}
.bt.wx{background:var(--wx)}.bt.dd{background:var(--didi)}.bt.ink{background:#1b1b1f}
.bt.o{background:#fff;color:var(--ali);box-shadow:0 0 0 1px #d5dbe6}
.li{background:#fff;border-radius:10px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;gap:4px;box-shadow:0 0 0 1px #eceef2}
.li .ic{width:18px;height:18px;border-radius:6px;background:#e9efff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-right:6px;flex:0 0 auto}
.hl{box-shadow:0 0 0 1.8px var(--red)!important}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;font-size:7.6px;font-weight:600}
.tiles div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tiles i{font-style:normal;width:24px;height:24px;border-radius:8px;background:#e9efff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tabbar{display:flex;justify-content:space-around;padding:6px 4px 8px;background:#fff;border-top:1px solid #eceef2;font-size:7.6px;font-weight:600;color:#8a8f98}
.tabbar .on{color:var(--ali)}
.hdr{padding:8px 11px 9px;color:#fff;background:var(--ali)}
.hdr.wx{background:#ededed;color:#111}
.hdr.dd{background:#fff;color:#111}
.qr{width:74px;height:74px;margin:2px auto;background:
  conic-gradient(from 90deg at 30% 30%,#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/12px 12px;border:5px solid #fff;outline:1px solid #ddd;border-radius:4px}
.bar{height:22px;margin:0 auto;width:86%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 3px,#111 3px 4px,#fff 4px 7px,#111 7px 10px,#fff 10px 11px)}
.cam{flex:1;border-radius:12px;background:#2a2a2e;position:relative;display:flex;align-items:center;justify-content:center}
.cam .fr{width:62%;aspect-ratio:1;border:2px solid #fff;border-radius:10px;opacity:.85}
.map{flex:1;border-radius:10px;background:
  linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/46px 46px,
  linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/46px 46px,#e8eef3;position:relative;min-height:60px}
.map .route{position:absolute;left:18%;top:20%;width:60%;height:60%;border-left:4px solid var(--ali);border-bottom:4px solid var(--ali);border-radius:0 0 0 18px}
.code6{display:flex;gap:4px}
.code6 span{flex:1;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #e3e5ea;text-align:center;font-weight:800;font-size:12px;padding:4px 0}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.2px}
th{font-family:var(--dela);font-weight:800;font-size:10.5px;text-transform:uppercase;text-align:left;padding:8px 10px;background:var(--ink);color:#fff}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:7px 10px;border-bottom:1.5px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fcfafa}
td .cn{font-size:15px;font-weight:700}

/* checklist */
.ck{list-style:none;display:flex;flex-direction:column;gap:5px}
.ck li{display:flex;gap:9px;align-items:flex-start;font-size:13.2px;line-height:1.35}
.ck li::before{content:"";flex:0 0 14px;height:14px;border-radius:4px;box-shadow:0 0 0 1.8px var(--ink);margin-top:1px;background:#fff}
.dots{position:absolute;background:radial-gradient(circle,#e9dede 1.3px,transparent 1.6px) 0 0/14px 14px}

/* timeline */
.tl{position:relative;margin-top:14px;padding-left:4px}
.tl::before{content:"";position:absolute;left:18px;top:10px;bottom:10px;border-left:2.5px dashed #e3caca}
.tl .it{position:relative;display:flex;gap:14px;margin-bottom:10px}
.tl .d{flex:0 0 30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff;z-index:1;text-align:center;line-height:1}
.tl .d.k{background:var(--ink)}
.tl .c{flex:1}
.tl .c h3{margin-bottom:2px}
.tl .c p{font-size:13.6px;color:var(--ink-2)}

/* divider pages */
.div{background:var(--red);color:#fff;padding:0}
.div .in-d{position:relative;z-index:2;padding:22mm 16mm;display:flex;flex-direction:column;height:100%}
.div .num{font-family:var(--dela);font-weight:900;font-size:150px;line-height:.85;letter-spacing:-.04em;color:rgba(255,255,255,.18)}
.div h1{font-size:54px;color:#fff;margin-top:10px}
.div .kick{color:#fff;font-size:38px}
.div ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:0}
.div li{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:9px 0;border-bottom:1.5px dashed rgba(255,255,255,.4)}
.div li span:last-child{font-family:var(--dela);font-weight:800;font-size:12px}
.div .mascot{position:absolute;right:-8mm;bottom:0;width:118mm;z-index:1}

/* phrases */
.ph-t td{padding:6px 8px;vertical-align:middle}
.ph-t .cn{font-size:19px;font-weight:700;white-space:nowrap}
.ph-t .ru{color:var(--red);font-weight:800;font-size:13.6px}
.ph-t .py{color:var(--mute);font-size:10.5px;display:block;font-weight:500}
.ph-t .no{font-family:var(--dela);font-weight:800;color:var(--red);font-size:10px;width:24px}
.ph-t tr.hot td{background:var(--pink)!important}.ph-t tr.hot .cn{color:var(--red)}.ph-t tr.hot td:first-child{border-left:3px solid var(--red)}
.grp{font-family:var(--dela);font-weight:800;font-size:10px;text-transform:uppercase;color:var(--red);padding:12px 8px 4px!important;background:#fff!important;border-bottom:2px solid var(--red)!important}

/* show cards */
.show{border-radius:18px;box-shadow:0 0 0 2px var(--ink);padding:12px 12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.show .cn{font-size:25px;font-weight:900;line-height:1.2}
.show .tr{font-size:11.5px;color:var(--mute);margin-top:4px}
.show .for{font-family:var(--hand);color:var(--red);font-size:20px;line-height:1}
.cut{border:1.5px dashed #cdbcbc;border-radius:22px;padding:6px}
.blank{border-bottom:1.5px solid var(--ink);height:26px}

.page.tight .scr{height:84mm}.page.tight table{font-size:12.4px}.page.tight td{padding:5px 9px}.page.tight .steps{gap:4px;margin-top:9px}.page.tight .steps li{font-size:13px}.page.tight .note{padding:14px 13px 9px;margin-top:11px}.page.tight .note .small,.page.tight .small{font-size:12.2px}.page.tight .ph-t td{padding:4px 8px}.page.tight .ph-t .cn{font-size:17.5px}.page.tight .lead{font-size:14.6px}.page.tight .kris{margin-top:10px}
.fit{width:100%}
a.pl{color:inherit;text-decoration:underline;text-decoration-color:rgba(200,23,23,.45);text-underline-offset:2px}
a.ext{color:inherit;text-decoration:none}
h1{text-wrap:balance}
.pharm .ru{white-space:nowrap}
.rules{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.rule{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line),0 6px 16px rgba(18,18,18,.04);text-decoration:none;color:var(--ink)}
.rule .rn{flex:0 0 30px;font-family:var(--dela);font-weight:900;font-size:17px;color:var(--red)}
.rule .re{flex:0 0 28px;font-size:23px;line-height:1;text-align:center}
.rule .rt{flex:1;min-width:0}
.rule .rt b{display:block;font-size:16px;font-weight:800;line-height:1.25}
.rule .rt span{display:block;font-size:12.8px;color:var(--mute);line-height:1.3;margin-top:1px}
.rule .rp{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--red);white-space:nowrap}
/* toc */
.toc-s{margin-top:12px}
.toc-s h2{display:flex;align-items:center;gap:8px}
.toc-r{color:inherit;text-decoration:none;display:flex;align-items:baseline;gap:6px;font-size:13.4px;padding:3.6px 0}
.toc-r .ln{flex:1;border-bottom:1.5px dotted #d3c4c4;transform:translateY(-3px)}
.toc-r .p{font-family:var(--dela);font-weight:800;font-size:10.5px;color:var(--red)}
.toc-r.hot b{color:var(--red)}

/* ===== приложение ===== */
html,body{background:var(--bg);margin:0}
body{font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%;padding:0}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}
/* шапка */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(248,245,245,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.topbar .ttl{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:0;background:#fff;box-shadow:0 0 0 1.5px var(--line);color:var(--ink);font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
/* главная */
.hero{position:relative;background:var(--red);color:#fff;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;min-height:200px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.2) 1.3px,transparent 1.6px) 0 0/14px 14px;-webkit-mask:linear-gradient(200deg,#000,transparent 60%);mask:linear-gradient(200deg,#000,transparent 60%)}
.hero>*{position:relative}
.hero .br{font-family:var(--dela);font-weight:900;font-size:11px;letter-spacing:.02em;opacity:.9}
.hero .h{font-family:var(--dela);font-weight:900;font-size:34px;line-height:.95;letter-spacing:-.02em;margin-top:16px}
.hero .s{font-size:14px;font-weight:600;max-width:52%;margin-top:8px;color:#ffe6e4}
.hero img{position:absolute;right:-24px;bottom:0;width:48%;max-width:250px}
.prog{margin:14px 16px 0;background:#fff;border-radius:18px;box-shadow:0 0 0 1.5px var(--line);padding:14px 16px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.prog .row b{font-family:var(--dela);font-size:20px;color:var(--red)}
.prog .bar2{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.prog .bar2 i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.prog .nx{display:block;margin-top:10px;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.prog .nx b{color:var(--red)}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);padding:0 14px;margin:12px 16px 0}
.srch input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:13px 0;background:transparent;min-width:0}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 0}
.tools a{background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);padding:12px 10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;gap:6px;min-height:76px}
.tools a i{font-style:normal;font-size:22px}
.sec3{padding:20px 16px 0}
.sec3 h3{display:flex;align-items:baseline;gap:8px;font-family:var(--dela);font-weight:800;font-size:12px;text-transform:uppercase;color:var(--red);margin:0 0 8px;letter-spacing:.02em}
.sec3 h3 small{font-family:var(--body);text-transform:none;font-weight:600;color:var(--mute);font-size:12px;letter-spacing:0}
.list{background:#fff;border-radius:18px;box-shadow:0 0 0 1.5px var(--line);overflow:hidden}
.list a{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--ink);border-top:1.5px solid var(--line);min-height:52px;box-sizing:border-box}
.list a:first-child{border-top:0}
.list a .e{flex:0 0 28px;font-size:21px;line-height:1;text-align:center}
.list a .t{flex:1;min-width:0}
.list a .t b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.list a .t em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:1px}
.list a .st{flex:0 0 auto;font-size:15px;color:var(--mute);font-weight:800}
.list a.done .t b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--jade)}
.list a.done .st{color:var(--jade)}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line);text-decoration:none;color:var(--ink)}
.rule .re{flex:0 0 26px;font-size:21px;line-height:1;text-align:center}
.rule .rt{flex:1;min-width:0}
.rule .rt b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.rule .rt span{display:block;font-size:12.5px;color:var(--mute);line-height:1.3}
.rule .rp{color:var(--mute);font-weight:800}
details.rl{margin:0}
details.rl summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--dela);font-weight:800;font-size:12px;text-transform:uppercase;color:var(--red);padding:2px 0 8px}
details.rl summary::-webkit-details-marker{display:none}
details.rl summary::after{content:"+";font-size:20px}
details.rl[open] summary::after{content:"−"}
/* глава */
.hd{padding:16px 16px 0}
.hd .ee{font-size:34px;line-height:1}
.hd h1{font-size:25px;margin-top:8px;text-transform:none;letter-spacing:-.01em;line-height:1.1}
.chip{display:inline-block;margin-top:8px;background:var(--pink);color:var(--red);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.why{padding:10px 16px 0;color:var(--ink-2);font-size:15px}
.why b{color:var(--ink)}
.page{width:auto;height:auto;min-height:0;margin:0;padding:0;display:block;overflow:visible;background:transparent}
.phones,.phones.two{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:14px 0 0;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.phones>div{flex:0 0 66%;max-width:250px;scroll-snap-align:center}
.scr{height:auto;min-height:92mm}
.swipe{padding:2px 16px 0;font-size:12px;color:var(--mute)}
.stp{list-style:none;margin:14px 16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.stp li{display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px var(--line);padding:11px 13px;font-size:15px;line-height:1.35}
.stp li .n{margin-top:1px}
.bul{list-style:none;margin:14px 16px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.bul li{background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px var(--line);padding:11px 13px;font-size:15px;line-height:1.35}
.imp{margin:14px 16px 0;border-radius:16px;box-shadow:inset 0 0 0 1.8px var(--red);background:#fff;padding:12px 14px}
.imp div{display:flex;gap:8px;font-size:14px;color:var(--ink-2);line-height:1.4}
.imp div+div{margin-top:7px}
.imp div::before{content:"!";flex:0 0 18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.imp b{color:var(--ink)}
.tb{margin:14px 16px 0;background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);overflow:hidden}
.tb table{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:var(--ink);color:#fff;font-family:var(--dela);font-weight:800;font-size:10px;text-transform:uppercase;text-align:left;padding:9px 12px}
.tb td{padding:9px 12px;border-top:1.5px solid var(--line);vertical-align:top}
.tb td:last-child{font-weight:700}
.donebtn{margin:18px 16px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:15.5px;padding:0 20px;cursor:pointer;text-decoration:none;width:100%;box-sizing:border-box}
.btn.o{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.btn.ok{background:var(--jade)}
.btn.sm{min-height:42px;font-size:14px;width:auto}
.pager{display:flex;gap:10px;padding:14px 16px 0}
.pager a{flex:1;min-height:52px;border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line);font-weight:800;font-size:13px;color:var(--ink);display:flex;flex-direction:column;justify-content:center;padding:8px 12px;text-decoration:none}
.pager a small{font-weight:600;color:var(--mute);font-size:11.5px}
.pager .nx{text-align:right;background:var(--ink);color:#fff;box-shadow:none}
.pager .nx small{color:#cfc6c6}
/* инструменты */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 16px 0}
.cd{background:#fff;border-radius:16px;box-shadow:0 0 0 2px var(--ink);padding:12px 8px 10px;text-align:center;cursor:pointer}
.cd:active{transform:scale(.98)}
.cd .c{font-family:var(--cn);font-weight:900;font-size:21px;line-height:1.2}
.cd .r{color:var(--red);font-weight:800;font-size:13px;margin-top:2px}
.cd .m{color:var(--mute);font-size:12px;line-height:1.3}
.cards.s3{grid-template-columns:repeat(3,1fr)}
.cards.s3 .cd .c{font-size:22px}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 16px 0}
.nums div{background:var(--ink);color:#fff;border-radius:12px;text-align:center;padding:7px 2px}
.nums b{display:block;font-family:var(--cn);font-size:18px}
.nums span{display:block;color:#ff8a80;font-weight:800;font-size:11px}
.nums i{display:block;font-style:normal;color:#bbb;font-size:10.5px}
.msg{margin:14px 16px 0}
.msg h3{font-family:var(--dela);font-weight:800;font-size:12px;text-transform:uppercase;color:var(--red);margin:0 0 8px}
.mr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px var(--line);padding:10px 12px;margin-bottom:6px;cursor:pointer}
.mr .t{flex:1;min-width:0}
.mr .t b{display:block;font-size:14.5px}
.mr .t span{display:block;font-family:var(--cn);font-size:13px;color:var(--ink-2);margin-top:2px}
.mr .cp{flex:0 0 auto;background:var(--pink);color:var(--red);font-weight:800;font-size:12px;border-radius:10px;padding:7px 10px}
.addr{margin:14px 16px 0;background:#fff;border-radius:18px;box-shadow:0 0 0 2px var(--ink);padding:14px;display:grid;gap:10px}
.addr label{font-size:12.5px;font-weight:700;color:var(--mute);display:grid;gap:4px}
.addr input,.addr textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.8px #dccfcf;padding:11px 12px;font:inherit;font-size:16px;font-family:var(--cn),var(--body);color:var(--ink)}
.conv{margin:14px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conv label{background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px var(--line);padding:8px 12px;font-size:12px;font-weight:700;color:var(--mute)}
.conv input{display:block;width:100%;border:0;outline:0;font:inherit;font-size:22px;font-weight:800;color:var(--ink);background:transparent;padding:2px 0 0}
.sos{display:flex;gap:6px;margin:14px 16px 0}
.sos div{flex:1;border-radius:14px;background:#fff;box-shadow:0 0 0 1.5px var(--line);text-align:center;padding:8px 4px;font-size:12px;color:var(--mute)}
.sos b{display:block;font-family:var(--dela);font-size:19px;color:var(--red)}
/* вход */
.lockbox{margin:14px 16px 0;background:#fff;border-radius:20px;box-shadow:0 0 0 2px var(--red);padding:16px}
.lockbox h2{margin:0 0 4px;font-size:17px}
.lockbox p{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.lockbox input{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 2px #dccfcf;padding:13px;font:inherit;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.lockbox .err{color:var(--red);font-size:13.5px;font-weight:700;margin-bottom:8px}
.price{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.price b{font-family:var(--dela);font-weight:900;font-size:24px;color:var(--red);white-space:nowrap}
.price span{font-size:12.5px;color:var(--mute)}
.lockch{margin:18px 16px 0;text-align:center;color:var(--ink-2)}
.foot{padding:22px 16px 0;text-align:center;font-size:12px;color:var(--mute);line-height:1.5}
.foot a{color:var(--ink-2)}
.hit{display:block;padding:11px 14px;border-top:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.hit:first-child{border-top:0}
.hit b{display:block;font-size:14.5px}
.hit span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.hit mark{background:#ffe3a3;color:inherit;border-radius:3px}
.full{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.full .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.full .lab{font-family:var(--hand);color:var(--red);font-size:30px;line-height:1}
.full .big{font-family:var(--cn);font-weight:900;line-height:1.15;color:#121212;white-space:pre-line;overflow-wrap:anywhere}
.full .py{color:var(--red);font-weight:800;font-size:22px}
.full .ru{color:var(--mute);font-size:17px;max-width:520px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#121212;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{font-family:var(--cn)}
.tapcn{border-bottom:1.5px dotted rgba(200,23,23,.5);cursor:pointer}
</style>

async function decrypt(hex){
  const raw=b64(BLOB),key=await crypto.subtle.importKey('raw',Uint8Array.from(hex.match(/../g).map(h=>parseInt(h,16))),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
async function openCode(code){
  const c=norm(code);if(!/^KT-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c))return {msg:'Код выглядит так: KT-XXXX-XXXX'};
  if(!API)return {msg:'Вход по коду ещё не подключён. Напиши Крис.'};
  let r;try{r=await (await fetch(API+'?code='+encodeURIComponent(c)+'&dev='+devId())).json()}catch(e){return {msg:'Нет связи. В Китае без VPN вход может не пройти — открой гайд дома.'}}
  if(!r.ok)return {msg:r.msg||'Код не подошёл. Напиши Крис.'};
  BODY=await decrypt(r.key);store.set('key',r.key);return {ok:1};
}

   ${next?`<a class="nx" href="#${next}">Следующее: <b>${esc(M.ch[next].t)}</b> · ${esc(M.ch[next].when)} ›</a>`:'<div class="nx"><b>Всё готово — хорошей дороги!</b></div>'}</div>
  <div class="srch">🔎<input id="q" type="search" placeholder="Поиск: Alipay, такси, вода…" value="${esc(q)}" aria-label="Поиск"></div>

  <div class="sec3"><details class="rl"${store.get('rl',1)?' open':''}><summary>10 правил первого дня</summary><div class="rules">${M.rules.map(r=>`<a class="rule" href="#${r[3]}"><span class="re">${r[0]}</span><span class="rt"><b>${esc(r[1])}</b><span>${esc(r[2])}</span></span><span class="rp">›</span></a>`).join('')}</div></details></div>
  ${M.parts.map(p=>`<div class="sec3"><h3>${esc(p.t)}${p.sub?`<small>${esc(p.sub)}</small>`:''}</h3><div class="list">${p.ids.map(id=>{const c=M.ch[id],o=isOpen(id),dn=c.task&&d[id];

  <div class="foot">Версия от ${esc(VERSION)} · обновления бесплатно<br>Вопросы — <a href="${CH}" target="_blank" rel="noopener">t.me/chinawithkris</a></div></div>`;
  const qi=$('#q');qi.oninput=()=>{store.set('q',qi.value);search(qi.value)};if(q)search(q);
  $('details.rl').ontoggle=e=>store.set('rl',e.target.open?1:0);
  const f=$('#code');if(f){$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent='Проверяю…';const r=await openCode(f.value);if(r.ok){toast('Гайд открыт');home()}else{$('#err').textContent=r.msg;b.disabled=false;b.textContent='Открыть'}};f.onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}

function lockBox(){
  return `<div class="lockbox"><h2>Открыть весь гайд</h2><p>Alipay, eSIM, WeChat по шагам с экранами, аэропорт, такси, еда, фразы, сообщения отелю. Плюс PDF для печати.</p>
  <div class="price"><b>${PRICE}</b><span>один раз · 3 устройства · без интернета</span></div>
  <a class="btn" href="${BOT}" target="_blank" rel="noopener">Купить в боте</a>
  <p style="margin:14px 0 6px"><b>Есть код?</b> Введи дома, до вылета.</p>
  <input id="code" autocomplete="off" autocapitalize="characters" placeholder="KT-XXXX-XXXX" aria-label="Код доступа">
  <div class="err" id="err" role="alert"></div><button class="btn o" id="go">Открыть</button></div>`;
}
const plain=c=>c?JSON.stringify(c).replace(/<[^>]+>/g,' ').replace(/\\"|[{}\[\]"]/g,' '):'';
function search(q){
  const box=$('#res');q=q.trim().toLowerCase();if(q.length<2){box.innerHTML='';return}
  const hits=[];
  for(const id of IDS){const c=getCh(id),m=M.ch[id];const t=(m.t+' '+(c&&!c.screens?plain(c):c?plain({...c,screens:''}):'')).replace(/\s+/g,' ');const i=t.toLowerCase().indexOf(q);if(i<0)continue;
    const a=Math.max(0,i-40);hits.push(`<a class="hit" href="#${id}"><b>${m.e} ${esc(m.t)}${isOpen(id)?'':' 🔒'}</b><span>${a?'…':''}${esc(t.slice(a,i))}<mark>${esc(t.slice(i,i+q.length))}</mark>${esc(t.slice(i+q.length,i+q.length+60))}…</span></a>`)}
  box.innerHTML=`<div class="sec3"><h3>Найдено: ${hits.length}</h3><div class="list">${hits.join('')||'<div class="hit"><span>Ничего. Попробуй другое слово.</span></div>'}</div></div>`;
}

/* ---------- глава ---------- */
const tapCn=h=>String(h).replace(/<span class="cn">([^<]+)<\/span>/g,'<span class="cn tapcn" data-cn="$1">$1</span>');
function chapter(id){
  const m=M.ch[id];if(!m)return home();
  if(!isOpen(id)){toast('Откроется после покупки');location.hash='';return}
  const c=getCh(id),i=IDS.indexOf(id),prev=IDS[i-1],next=IDS[i+1],d=done();
  let h=`<div class="topbar"><a class="ib" href="#" aria-label="На главную">‹</a><div class="ttl">${esc(m.t)}</div><a class="ib" href="#addr" aria-label="Таксисту">🚖</a></div><div class="wrap">
  <div class="hd"><div class="ee">${m.e}</div><h1>${esc(m.t)}</h1>${m.when?`<span class="chip">${esc(m.when)}</span>`:''}</div>`;
  if(c.why)h+=`<p class="why">${tapCn(c.why)}</p>`;
  if(m.tool)h+=tool(id,c);
  if(c.screens)h+=`<div class="page">${c.screens}</div><div class="swipe">← листай экраны →</div>`;
  if(c.steps)h+=`<ol class="stp">${c.steps.map((s,k)=>`<li><span class="n">${k+1}</span><span>${tapCn(s)}</span></li>`).join('')}</ol>`;
  if(c.list)h+=`<ul class="bul">${c.list.map(s=>`<li>${tapCn(s)}</li>`).join('')}</ul>`;
  if(c.apps)h+=`<ul class="bul">${c.apps.map(a=>`<li style="display:flex;gap:12px;align-items:center"><span style="flex:0 0 36px;height:36px;border-radius:10px;background:${a[1]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900" class="cn">${a[0]}</span><span><b>${esc(a[2])}</b> <span class="cn" style="color:var(--red)">${a[3]}</span><br><span style="font-size:13px;color:var(--ink-2)">${esc(a[4])}</span></span></li>`).join('')}</ul>`;
  if(c.check){const ck=store.get('ck-'+id,{});h+=`<ul class="bul">${c.check.map((s,k)=>`<li class="ckl" data-k="${k}" style="display:flex;gap:10px;cursor:pointer"><span class="bx" style="flex:0 0 20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;${ck[k]?'background:var(--jade);box-shadow:none':''}">${ck[k]?'✓':''}</span><span>${esc(s)}</span></li>`).join('')}</ul>`}
  if(c.dishes)h+=`<div class="cards">${c.dishes.map(x=>`<div class="cd" data-cn="${esc(x[0])}" data-py="${esc(x[1])}" data-ru="${esc(x[2]+' · '+x[4]+' ¥')}"><div class="c">${x[0]}</div><div class="r">${esc(x[1])}</div><div class="m">${esc(x[2])}${x[3]?' '+'🌶'.repeat(x[3]):''}<br>${esc(x[4])} ¥</div></div>`).join('')}</div>`;
  if(c.table)h+=`<div class="tb"><table><tr>${c.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${c.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(c.note)h+=`<div class="imp">${c.note.map(s=>`<div><span>${tapCn(s)}</span></div>`).join('')}</div>`;
  if(m.task)h+=`<div class="donebtn"><button class="btn ${d[id]?'ok':''}" id="done">${d[id]?'✓ Сделано':'Отметить: сделано'}</button></div>`;
  h+=`<div class="pager">${prev?`<a href="#${prev}">‹ ${esc(M.ch[prev].t)}<small>назад</small></a>`:''}${next?`<a class="nx" href="#${next}">${esc(M.ch[next].t)} ›<small>дальше</small></a>`:'<a class="nx" href="#">На главную ›<small>все разделы</small></a>'}</div></div>`;
  app.innerHTML=h;
  wire(id,c);store.set('last',id);document.title=m.t+' — 24 часа';window.scrollTo(0,0);
}
function wire(id,c){
  const b=$('#done');if(b)b.onclick=()=>{const d=done();d[id]=d[id]?0:1;store.set('done',d);if(d[id]){toast('Готово ✓');const nx=TASKS.find(x=>!d[x]);setTimeout(()=>location.hash=nx?'#'+nx:'',450)}else chapter(id)};
  $$('.tapcn').forEach(el=>el.onclick=e=>{e.preventDefault();const nx=el.nextSibling&&el.nextSibling.textContent||'';const m=nx.match(/«([^»]+)»/);full({cn:el.dataset.cn,py:m?m[1]:''})});
  $$('.cd').forEach(el=>el.onclick=()=>full({cn:el.dataset.cn,py:el.dataset.py,ru:el.dataset.ru}));
  $$('.mr').forEach(el=>el.onclick=()=>copy(el.dataset.cn));
  $$('.ckl').forEach(li=>li.onclick=()=>{const ck=store.get('ck-'+id,{});ck[li.dataset.k]=ck[li.dataset.k]?0:1;store.set('ck-'+id,ck);chapter(id);window.scrollTo(0,li.offsetTop-120)});
  // адрес для таксиста
  const hs=$('#hs');if(hs){const save=()=>store.set('hotel',{n:$('#hn').value,a:$('#ha').value,t:$('#ht').value});$$('.addr input,.addr textarea').forEach(i=>i.oninput=save);
    hs.onclick=()=>{const n=$('#hn').value.trim(),a=$('#ha').value.trim(),t=$('#ht').value.trim();if(!n&&!a){toast('Сначала впиши адрес');$('#ha').focus();return}
      full({lab:'для таксиста',cn:'请带我去这个地址\n'+[n,a].filter(Boolean).join('\n')+(t?'\n电话 '+t:''),ru:'Пожалуйста, отвезите меня по этому адресу'})}}
  // конвертер
  const cy=$('#cy'),cr=$('#cr'),rt=$('#rt');if(cy){const rate=()=>parseFloat(rt.value.replace(',','.'))||13;
    cy.oninput=()=>{const v=parseFloat(cy.value);cr.value=isFinite(v)?Math.round(v*rate()):''};cr.oninput=()=>{const v=parseFloat(cr.value);cy.value=isFinite(v)?Math.round(v/rate()*10)/10:''};
    rt.oninput=()=>{store.set('rate',rt.value);cy.oninput();$$('[data-y]').forEach(x=>{const [a,b]=x.dataset.y.split('-').map(Number);x.textContent=(a===b?Math.round(a*rate()):Math.round(a*rate())+'–'+Math.round(b*rate()))+' ₽'})}}
}
function tool(id,c){
  if(id==='addr'){const v=store.get('hotel',{n:'',a:'',t:''});

    <label>Адрес иероглифами<textarea id="ha" rows="2" lang="zh-Hans" placeholder="上海市黄浦区茂名南路59号">${esc(v.a)}</textarea></label>
    <label>Телефон отеля<input id="ht" inputmode="tel" placeholder="+86 21 …" value="${esc(v.t)}"></label>
    <button class="btn" id="hs">Показать таксисту</button></div>`}
  if(id==='phr')return `<p class="why">Нажми — фраза на весь экран. Красным — как сказать.</p><div class="cards">${c.phr.map(p=>`<div class="cd" data-cn="${esc(p[0])}" data-py="${esc(p[1])}" data-ru="${esc(p[2])}"><div class="c">${p[0]}</div><div class="r">${esc(p[1])}</div><div class="m">${esc(p[2])}</div></div>`).join('')}</div>
    <div class="sec3" style="padding-top:18px"><h3>Цифры</h3></div><div class="nums" style="margin-top:0">${c.nums.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><i>${x[2]}</i></div>`).join('')}</div><p class="why" style="font-size:13px">25 = 二十五 «эр-ши-у» · 150 = 一百五 «и-бай-у»</p>`;
  if(id==='msg')return `<p class="why">Нажми — текст скопируется. Вставь в WeChat или чат DiDi, ___ замени своим.</p>${c.groups.map(g=>`<div class="msg"><h3>${esc(g[0])}</h3>${g[1].map(x=>`<div class="mr" data-cn="${esc(x[1])}"><div class="t"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div><span class="cp">Копировать</span></div>`).join('')}</div>`).join('')}<p class="why" style="font-size:13px">Ответ пришёл иероглифами — зажми его в WeChat → Translate.</p>`;
  if(id==='signs')return `<div class="cards s3">${c.signs.map(x=>`<div class="cd" data-cn="${esc(x[0])}" data-ru="${esc(x[1])}"><div class="c">${x[0]}</div><div class="m">${esc(x[1])}</div></div>`).join('')}</div>`;
  if(id==='pharm')return `<p class="why">Покажи фармацевту. Аптека — <span class="cn">药店</span>, зелёный крест.</p><div class="sec3" style="padding-top:12px"><h3>Что болит</h3></div><div class="cards s3" style="margin-top:0">${c.sick.map(x=>`<div class="cd" data-cn="${esc(x[0])}" data-ru="${esc(x[1])}"><div class="c" style="font-size:19px">${x[0]}</div><div class="m">${esc(x[1])}</div></div>`).join('')}</div>
    <div class="sec3" style="padding-top:14px"><h3>Что купить</h3></div><div class="cards" style="margin-top:0">${c.buy.map(x=>`<div class="cd" data-cn="${esc(x[0])}" data-ru="${esc(x[1])}"><div class="c" style="font-size:19px">${x[0]}</div><div class="m">${esc(x[1])}</div></div>`).join('')}</div>
    <div class="sos">${c.sos.map(x=>`<div><b>${x[0]}</b>${esc(x[1])}</div>`).join('')}</div>`;
  if(id==='prices'){const r=store.get('rate','13');const R=parseFloat(String(r).replace(',','.'))||13;
    return `<div class="conv"><label>Юани, ¥<input id="cy" inputmode="decimal" placeholder="100"></label><label>Рубли, ₽<input id="cr" inputmode="decimal" placeholder="1300"></label></div>
    <div class="conv" style="grid-template-columns:1fr"><label>Курс, ₽ за ¥ — поставь из своего банка<input id="rt" inputmode="decimal" value="${esc(r)}"></label></div>
    <div class="tb"><table><tr><th>Что</th><th>¥</th><th>₽</th></tr>${c.rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]===x[2]?x[1]:x[1]+'–'+x[2]}</td><td data-y="${x[1]}-${x[2]}">${x[1]===x[2]?Math.round(x[1]*R):Math.round(x[1]*R)+'–'+Math.round(x[2]*R)} ₽</td></tr>`).join('')}</table></div>`}
  return '';
}

/* ---------- маршрутизация ---------- */
function route(){const id=location.hash.slice(1);if(id&&M.ch[id])return chapter(id);home()}
window.addEventListener('hashchange',route);
(async function boot(){
  if(PREVIEW)BODY=PREVIEW;
  else{const k=store.get('key',null);if(k&&BLOB){try{BODY=await decrypt(k)}catch(e){store.set('key',null)}}}
  route();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
