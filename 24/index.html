<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Китай: первые 24 часа — Крис про Китай</title>
<meta name="theme-color" content="#c81717">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Golos+Text:wght@400;500;600;700;800&family=Caveat:wght@700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
/* ===== стили страниц гайда (из guide.html) ===== */

:root{
  --red:#c81717;--red-2:#e02a2a;--ink:#121212;--ink-2:#3d3535;--mute:#7a6f6f;
  --line:#efe6e6;--bg:#f8f5f5;--pink:#fdf2f2;--pink-2:#f7dede;
  --jade:#16804a;--jade-soft:#e2f4ea;--sky:#2f6fed;--sky-soft:#e8effd;
  --ali:#1677ff;--wx:#07c160;--didi:#ff7a1a;
  --dela:Unbounded,"Noto Sans SC","Arial Black",sans-serif;
  --body:"Golos Text","Noto Sans SC","Segoe UI",Arial,sans-serif;
  --hand:Caveat,cursive;
  --cn:"Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:A4;margin:0}
html,body{background:#ddd}
body{font-family:var(--body);color:var(--ink);font-size:14.4px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;padding:13mm 14mm 15mm;margin:0 auto 10px;page-break-after:always;break-after:page;display:flex;flex-direction:column}
@media print{html,body{background:#fff}.page{margin:0}}
b,strong{font-weight:700;color:var(--ink)}
.cn{font-family:var(--cn)}
.r{color:var(--red)}
.mute{color:var(--mute)}

/* header / footer */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9mm}
.brand{font-family:var(--dela);font-weight:900;font-size:10.5px;letter-spacing:.02em;line-height:1}
.brand .r{margin-right:4px}
.sec{font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sec i{font-style:normal;color:var(--red);margin:0 5px}
.pn{position:absolute;right:14mm;bottom:8mm;font-family:var(--dela);font-weight:800;font-size:11px;color:var(--red)}
.pn-l{position:absolute;left:14mm;bottom:8mm;font-size:9.5px;color:var(--mute);font-weight:600}

/* type */
.kick{font-family:var(--hand);font-size:32px;line-height:.9;color:var(--red);margin-bottom:2px}
h1{font-family:var(--dela);font-weight:900;font-size:32px;line-height:1.08;text-transform:uppercase;letter-spacing:-.01em}
h1 .r{color:var(--red)}
h2{font-family:var(--dela);font-weight:800;font-size:15.5px;text-transform:uppercase;line-height:1.2;margin-bottom:6px}
h3{font-family:var(--dela);font-weight:800;font-size:12.5px;text-transform:uppercase;line-height:1.25;margin-bottom:4px}
.lead{font-size:15.4px;font-weight:500;color:var(--ink-2);margin-top:9px;max-width:165mm}
.lead b{color:var(--ink)}
p+p{margin-top:6px}
.small{font-size:12.8px}
.xs{font-size:11.6px;line-height:1.4}
.gap{height:12px}.gap-s{height:7px}.gap-l{height:18px}
.grow{flex:1}

/* cards */
.card{border-radius:18px;background:#fff;box-shadow:0 0 0 1.5px var(--line),0 8px 20px rgba(18,18,18,.05);padding:13px 15px}
.card.pink{background:var(--pink);box-shadow:0 0 0 1.5px var(--pink-2)}
.card.soft{background:var(--bg);box-shadow:none}
.card.dark{background:var(--ink);color:#fff;box-shadow:none}
.card.dark b,.card.dark strong{color:#fff}
.card.red{background:var(--red);color:#fff;box-shadow:none}
.card.red b{color:#fff}
.card.jade{background:var(--jade-soft);box-shadow:none}
.card.line{box-shadow:0 0 0 2px var(--ink)}
.torn{padding-bottom:20px;-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 8px repeat-x}
.dash{border:0;border-top:2px dashed #dccfcf;margin:9px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{display:flex;gap:10px;align-items:flex-start}

/* callouts */
.note{position:relative;border-radius:18px;padding:17px 15px 12px;box-shadow:0 0 0 1.8px var(--red);margin-top:14px;background:#fff}
.note .t{position:absolute;top:-10px;left:14px;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px 3px;border-radius:999px}
.note.ink{box-shadow:0 0 0 1.8px var(--ink)}
.note.ink .t{background:var(--ink)}
.note.fill{background:var(--pink);box-shadow:none}
.note.warn .t::before{content:"! "}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-weight:800;font-size:11.5px;background:var(--ink);color:#fff;white-space:nowrap}
.pill.o{background:#fff;color:var(--ink);box-shadow:0 0 0 1.8px var(--ink)}
.pill.red{background:var(--red)}
.pill.soft{background:var(--pink);color:var(--red)}
.pill.g{background:var(--jade-soft);color:var(--jade)}

/* kris tip */
.kris{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.kris .ava{flex:0 0 52px;height:52px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px var(--red);background:#fff}
.kris .ava img{width:100%;height:100%;object-fit:cover;object-position:52% 14%;transform:scale(1.9);transform-origin:52% 24%}
.kris .bub{flex:1;background:var(--pink);border-radius:4px 18px 18px 18px;padding:9px 14px 10px}
.kris .bub .h{font-family:var(--hand);font-size:24px;color:var(--red);line-height:1;margin-bottom:2px}

/* numbered steps */
.n{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:9.5px;line-height:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--red);vertical-align:middle}
.steps{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.8px;line-height:1.45}
.steps li .n{margin-top:1px}
.steps.big li{font-size:14.6px}

/* phones */
.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.phones.two{grid-template-columns:repeat(2,52mm);justify-content:center;gap:26px}
.pcap{font-family:var(--dela);font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;color:var(--ink)}
.pcap .r{color:var(--red)}
.ph{background:var(--ink);border-radius:26px;padding:6px;box-shadow:0 10px 24px rgba(18,18,18,.14)}
.scr{background:#f6f7f9;border-radius:21px;height:100mm;overflow:hidden;position:relative;font-size:9.6px;line-height:1.35;color:#1b1b1f;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:7px 14px 3px;font-weight:700;font-size:8.5px}
.nav{padding:4px 11px 7px;font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px}
.nav .bk{color:#888;font-size:13px;line-height:1}
.pbody{padding:2px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pt{font-weight:800;font-size:13px;line-height:1.15}
.ps{color:#8a8f98;font-size:8.6px}
.in{background:#fff;border-radius:9px;padding:7px 9px;box-shadow:0 0 0 1px #e3e5ea;display:flex;justify-content:space-between;align-items:center;gap:4px}
.in.on{box-shadow:0 0 0 1.6px var(--ali)}
.lb{color:#8a8f98;font-size:8.2px}
.bt{border-radius:9px;padding:7px 8px;text-align:center;font-weight:800;color:#fff;background:var(--ali);font-size:10px;display:flex;justify-content:center;align-items:center;gap:6px}
.bt.wx{background:var(--wx)}.bt.dd{background:var(--didi)}.bt.ink{background:#1b1b1f}
.bt.o{background:#fff;color:var(--ali);box-shadow:0 0 0 1px #d5dbe6}
.li{background:#fff;border-radius:10px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;gap:4px;box-shadow:0 0 0 1px #eceef2}
.li .ic{width:18px;height:18px;border-radius:6px;background:#e9efff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-right:6px;flex:0 0 auto}
.hl{box-shadow:0 0 0 1.8px var(--red)!important}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;font-size:7.6px;font-weight:600}
.tiles div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tiles i{font-style:normal;width:24px;height:24px;border-radius:8px;background:#e9efff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tabbar{display:flex;justify-content:space-around;padding:6px 4px 8px;background:#fff;border-top:1px solid #eceef2;font-size:7.6px;font-weight:600;color:#8a8f98}
.tabbar .on{color:var(--ali)}
.hdr{padding:8px 11px 9px;color:#fff;background:var(--ali)}
.hdr.wx{background:#ededed;color:#111}
.hdr.dd{background:#fff;color:#111}
.qr{width:74px;height:74px;margin:2px auto;background:
  conic-gradient(from 90deg at 30% 30%,#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/12px 12px;border:5px solid #fff;outline:1px solid #ddd;border-radius:4px}
.bar{height:22px;margin:0 auto;width:86%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 3px,#111 3px 4px,#fff 4px 7px,#111 7px 10px,#fff 10px 11px)}
.cam{flex:1;border-radius:12px;background:#2a2a2e;position:relative;display:flex;align-items:center;justify-content:center}
.cam .fr{width:62%;aspect-ratio:1;border:2px solid #fff;border-radius:10px;opacity:.85}
.map{flex:1;border-radius:10px;background:
  linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/46px 46px,
  linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/46px 46px,#e8eef3;position:relative;min-height:60px}
.map .route{position:absolute;left:18%;top:20%;width:60%;height:60%;border-left:4px solid var(--ali);border-bottom:4px solid var(--ali);border-radius:0 0 0 18px}
.code6{display:flex;gap:4px}
.code6 span{flex:1;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #e3e5ea;text-align:center;font-weight:800;font-size:12px;padding:4px 0}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.2px}
th{font-family:var(--dela);font-weight:800;font-size:10.5px;text-transform:uppercase;text-align:left;padding:8px 10px;background:var(--ink);color:#fff}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:7px 10px;border-bottom:1.5px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fcfafa}
td .cn{font-size:15px;font-weight:700}

/* checklist */
.ck{list-style:none;display:flex;flex-direction:column;gap:5px}
.ck li{display:flex;gap:9px;align-items:flex-start;font-size:13.2px;line-height:1.35}
.ck li::before{content:"";flex:0 0 14px;height:14px;border-radius:4px;box-shadow:0 0 0 1.8px var(--ink);margin-top:1px;background:#fff}
.dots{position:absolute;background:radial-gradient(circle,#e9dede 1.3px,transparent 1.6px) 0 0/14px 14px}

/* timeline */
.tl{position:relative;margin-top:14px;padding-left:4px}
.tl::before{content:"";position:absolute;left:18px;top:10px;bottom:10px;border-left:2.5px dashed #e3caca}
.tl .it{position:relative;display:flex;gap:14px;margin-bottom:10px}
.tl .d{flex:0 0 30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--dela);font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff;z-index:1;text-align:center;line-height:1}
.tl .d.k{background:var(--ink)}
.tl .c{flex:1}
.tl .c h3{margin-bottom:2px}
.tl .c p{font-size:13.6px;color:var(--ink-2)}

/* divider pages */
.div{background:var(--red);color:#fff;padding:0}
.div .in-d{position:relative;z-index:2;padding:22mm 16mm;display:flex;flex-direction:column;height:100%}
.div .num{font-family:var(--dela);font-weight:900;font-size:150px;line-height:.85;letter-spacing:-.04em;color:rgba(255,255,255,.18)}
.div h1{font-size:54px;color:#fff;margin-top:10px}
.div .kick{color:#fff;font-size:38px}
.div ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:0}
.div li{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:9px 0;border-bottom:1.5px dashed rgba(255,255,255,.4)}
.div li span:last-child{font-family:var(--dela);font-weight:800;font-size:12px}
.div .mascot{position:absolute;right:-8mm;bottom:0;width:118mm;z-index:1}

/* phrases */
.ph-t td{padding:6px 8px;vertical-align:middle}
.ph-t .cn{font-size:19px;font-weight:700;white-space:nowrap}
.ph-t .ru{color:var(--red);font-weight:800;font-size:13.6px}
.ph-t .py{color:var(--mute);font-size:10.5px;display:block;font-weight:500}
.ph-t .no{font-family:var(--dela);font-weight:800;color:var(--red);font-size:10px;width:24px}
.ph-t tr.hot td{background:var(--pink)!important}.ph-t tr.hot .cn{color:var(--red)}.ph-t tr.hot td:first-child{border-left:3px solid var(--red)}
.grp{font-family:var(--dela);font-weight:800;font-size:10px;text-transform:uppercase;color:var(--red);padding:12px 8px 4px!important;background:#fff!important;border-bottom:2px solid var(--red)!important}

/* show cards */
.show{border-radius:18px;box-shadow:0 0 0 2px var(--ink);padding:12px 12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.show .cn{font-size:25px;font-weight:900;line-height:1.2}
.show .tr{font-size:11.5px;color:var(--mute);margin-top:4px}
.show .for{font-family:var(--hand);color:var(--red);font-size:20px;line-height:1}
.cut{border:1.5px dashed #cdbcbc;border-radius:22px;padding:6px}
.blank{border-bottom:1.5px solid var(--ink);height:26px}

.page.tight .scr{height:84mm}.page.tight table{font-size:12.4px}.page.tight td{padding:5px 9px}.page.tight .steps{gap:4px;margin-top:9px}.page.tight .steps li{font-size:13px}.page.tight .note{padding:14px 13px 9px;margin-top:11px}.page.tight .note .small,.page.tight .small{font-size:12.2px}.page.tight .ph-t td{padding:4px 8px}.page.tight .ph-t .cn{font-size:17.5px}.page.tight .lead{font-size:14.6px}.page.tight .kris{margin-top:10px}
.fit{width:100%}
a.pl{color:inherit;text-decoration:underline;text-decoration-color:rgba(200,23,23,.45);text-underline-offset:2px}
a.ext{color:inherit;text-decoration:none}
h1{text-wrap:balance}
.pharm .ru{white-space:nowrap}
/* toc */
.toc-s{margin-top:12px}
.toc-s h2{display:flex;align-items:center;gap:8px}
.toc-r{color:inherit;text-decoration:none;display:flex;align-items:baseline;gap:6px;font-size:13.4px;padding:3.6px 0}
.toc-r .ln{flex:1;border-bottom:1.5px dotted #d3c4c4;transform:translateY(-3px)}
.toc-r .p{font-family:var(--dela);font-weight:800;font-size:10.5px;color:var(--red)}
.toc-r.hot b{color:var(--red)}

/* ===== приложение: страницы A4 → экран телефона ===== */
html,body{background:var(--bg);margin:0}
body{font-size:15px;-webkit-text-size-adjust:100%;padding:0}
a{color:inherit}
.page{width:auto;height:auto;min-height:0;margin:0;padding:6px 16px 8px;display:block;overflow:visible;background:transparent;break-after:auto;page-break-after:auto}
.page .dots,.page .pn,.page>[style*="position:absolute"]{display:none}
.page>div[style*="position:relative"]{padding:0!important;height:auto!important}
.page .grow{display:none}
h1{font-size:27px}
.kick{font-size:28px}
.lead{max-width:none}
.phones{margin-top:14px}
.scr{height:auto;min-height:92mm}
.ck li{cursor:pointer;user-select:none}
.ck li.on::before{background:var(--jade);box-shadow:0 0 0 1.8px var(--jade);content:"✓";color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ck li.on{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--jade)}
.show,.tap{cursor:pointer}
.show:active,.tap:active{transform:scale(.985)}
.page .cn.tap{border-bottom:1.5px dotted rgba(200,23,23,.5)}
tr.tap td:first-child{position:relative}
tr.copy td:last-child{padding-right:34px;position:relative}
tr.copy td:last-child::after{content:"⧉";position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:7px;background:var(--pink);color:var(--red);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){
  .grid2,.grid3,.page [style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .grid4{grid-template-columns:repeat(3,1fr)!important}
  .grid3.keep,.grid2.pharm{grid-template-columns:1fr!important}
  .phones,.phones.two{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:14px -16px 0;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
  .phones>div{flex:0 0 68%;scroll-snap-align:center}
  .tw{margin:0 -16px;padding:0 16px}
  .tw table.wide{min-width:560px}
  .page [style*="display:flex;gap:8px;align-items:flex-end"]{flex-wrap:wrap}
  .page [style*="display:flex;gap:8px;align-items:flex-end"]>.card{flex:1 1 28%!important}
  .note .t{white-space:nowrap}
}
/* ===== оболочка ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.topbar .ttl{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-weight:600;font-size:11px;color:var(--mute)}
.ib{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:0;background:var(--pink);color:var(--red);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.pager{display:flex;gap:10px;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pager a,.pager button{flex:1;min-height:52px;border-radius:16px;border:0;background:#fff;box-shadow:0 0 0 1.5px var(--line);font:inherit;font-weight:800;font-size:13px;color:var(--ink);display:flex;flex-direction:column;justify-content:center;padding:8px 12px;text-decoration:none;cursor:pointer;text-align:left}
.pager a small,.pager button small{font-weight:600;color:var(--mute);font-size:11px}
.pager .nx{text-align:right;background:var(--ink);color:#fff;box-shadow:none}
.pager .nx small{color:#cfc6c6}
.wrap{max-width:720px;margin:0 auto}
.hero{position:relative;background:var(--red);color:#fff;overflow:hidden;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 0;min-height:340px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.2) 1.3px,transparent 1.6px) 0 0/14px 14px;-webkit-mask:linear-gradient(200deg,#000,transparent 60%);mask:linear-gradient(200deg,#000,transparent 60%)}
.hero>*{position:relative}
.hero .br{font-family:var(--dela);font-weight:900;font-size:12px;letter-spacing:.02em}
.hero .kk{font-family:var(--hand);font-size:32px;line-height:1;margin-top:20px}
.hero .h{font-family:var(--dela);font-weight:900;font-size:40px;line-height:.95;letter-spacing:-.02em;margin-top:4px}
.hero .s{font-size:14.5px;font-weight:600;max-width:50%;margin-top:10px;color:#ffe6e4;line-height:1.4}
.hero img{position:absolute;right:-30px;bottom:0;width:56%;max-width:300px}
.sec2{padding:18px 16px 4px}
.sec2 h2{margin:0 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:15.5px;padding:0 20px;cursor:pointer;text-decoration:none;width:100%}
.btn.o{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.btn.sm{min-height:42px;font-size:14px;width:auto}
.btn+.btn{margin-top:10px}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);padding:0 14px;margin:14px 16px 0}
.srch input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:14px 0;background:transparent;min-width:0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0}
.quick a{background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);padding:12px 10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:12.5px;line-height:1.25;display:flex;flex-direction:column;gap:6px;min-height:84px}
.quick a i{font-style:normal;font-size:22px}
.part{padding:20px 16px 0}
.part h3{font-family:var(--dela);font-weight:800;font-size:12px;text-transform:uppercase;color:var(--red);margin:0 0 8px;letter-spacing:.02em}
.list{background:#fff;border-radius:18px;box-shadow:0 0 0 1.5px var(--line);overflow:hidden}
.list a{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;color:var(--ink);border-top:1.5px solid var(--line)}
.list a:first-child{border-top:0}
.list a .no{flex:0 0 30px;font-size:21px;line-height:1;text-align:center}
.list a span{flex:1;min-width:0}
.list a b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.list a em{display:block;font-style:normal;font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
.list a .st{flex:0 0 auto;font-size:13px;color:var(--mute)}
.list a.rd b{color:var(--ink-2)}
.list a.lk{color:var(--mute)}
.lockbox{margin:16px 16px 0;background:#fff;border-radius:22px;box-shadow:0 0 0 2px var(--red);padding:18px 16px}
.lockbox h2{margin:0 0 4px}
.lockbox p{font-size:14px;color:var(--ink-2);margin:0 0 12px}
.lockbox input{width:100%;border:0;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line-2,#dccfcf);padding:14px;font:inherit;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;box-sizing:border-box}
.lockbox .err{color:var(--red);font-size:13.5px;font-weight:700;margin:-4px 0 10px;min-height:0}
.price{display:flex;align-items:baseline;gap:8px;margin:4px 0 12px}
.price b{font-family:var(--dela);font-weight:900;font-size:26px;color:var(--red);white-space:nowrap}
.foot{padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--mute);line-height:1.5}
.foot a{color:var(--ink-2)}
.hit{display:block;padding:12px 14px;border-top:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.hit:first-child{border-top:0}
.hit b{display:block;font-size:14px}
.hit span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.hit mark{background:#ffe3a3;color:inherit;border-radius:3px}
.addr{display:grid;gap:8px;margin-top:10px;text-align:left}
.addr label{font-size:12px;font-weight:700;color:var(--mute)}
.addr input,.addr textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.8px #dccfcf;padding:11px 12px;font:inherit;font-size:16px;font-family:var(--cn),var(--body)}
.full{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.full .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.full .lab{font-family:var(--hand);color:var(--red);font-size:30px;line-height:1}
.full .big{font-family:var(--cn);font-weight:900;line-height:1.15;color:#121212;white-space:pre-line;overflow-wrap:anywhere}
.full .py{color:var(--red);font-weight:800;font-size:22px}
.full .ru{color:var(--mute);font-size:17px;max-width:520px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#121212;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.spin{padding:60px 16px;text-align:center;color:var(--mute)}
</style>
</head>

const FREE={"2":"\n  \n  <div style=\"display:grid;grid-template-columns:62mm 1fr;gap:16px;align-items:start\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden;height:74mm;background:#fff\"><img src=\"@IMG@kris.jpg\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 20%\" alt=\"\"></div>\n    <div>\n      <div class=\"kick\" style=\"font-size:40px\">Привет, я Крис!</div>\n      <p style=\"font-size:13.6px;color:var(--ink-2);font-weight:500;margin-top:6px\">Я дважды училась в Китае — в <b>Чэнду</b> и <b>Шанхае</b>, прожила там в сумме год и вожу оттуда вещи. В первый приезд мой китайский был <b>на нуле</b> — и я справлялась: такси, магазины, аренда квартиры. Всё, что для этого нужно, — в этом гайде.</p>\n      <p style=\"font-size:13.6px;color:var(--ink-2);font-weight:500\">Первый день в Китае пугает всех: карты не работают, Google молчит, таксист не говорит по-английски, а кассир ждёт QR-код. Этот гайд убирает страх: здесь показано, <b>куда нажимать, что говорить и сколько платить</b>.</p>\n    </div>\n  </div>\n\n  <h2 style=\"margin-top:16px\">Как устроен гайд</h2>\n  <div class=\"grid3\">\n    <div class=\"card pink\"><div style=\"font-family:var(--dela);font-weight:900;font-size:30px;color:var(--red);line-height:1\">01</div><h3 style=\"margin-top:6px\">Дома</h3><p class=\"small\" style=\"color:var(--ink-2)\">За 7–14 дней до вылета: въезд, деньги, Alipay, интернет, приложения, чек-лист.</p><div class=\"pill soft\" style=\"margin-top:8px\"><a class=\"pl\" href=\"#p-6\">стр. 6–26</a></div></div>\n    <div class=\"card pink\"><div style=\"font-family:var(--dela);font-weight:900;font-size:30px;color:var(--red);line-height:1\">02</div><h3 style=\"margin-top:6px\">Аэропорт</h3><p class=\"small\" style=\"color:var(--ink-2)\">Первые 2 часа, граница, багаж, как доехать до отеля и не переплатить.</p><div class=\"pill soft\" style=\"margin-top:8px\"><a class=\"pl\" href=\"#p-27\">стр. 27–30</a></div></div>\n    <div class=\"card pink\"><div style=\"font-family:var(--dela);font-weight:900;font-size:30px;color:var(--red);line-height:1\">03</div><h3 style=\"margin-top:6px\">Первый вечер</h3><p class=\"small\" style=\"color:var(--ink-2)\">Отель, еда, цены, привычки, ловушки, фразы и что делать, если что-то сломалось.</p><div class=\"pill soft\" style=\"margin-top:8px\"><a class=\"pl\" href=\"#p-31\">стр. 31–47</a></div></div>\n  </div>\n\n  <h2 style=\"margin-top:16px\">Как читать</h2>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"row\"><span class=\"n\">1</span><p class=\"small\"><b>Красные кружки с цифрами</b> на скринах — куда нажимать. Под картинкой — что делать на каждом шаге. Экраны нарисованы схематично: в живом приложении кнопка может стоять чуть иначе, но называется так же.</p></div></div>\n    <div class=\"card\"><div class=\"row\"><span style=\"flex:0 0 26px;height:26px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--red)\"><img src=\"@IMG@kris.jpg\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 18%\" alt=\"\"></span><p class=\"small\"><b>«Крис советует»</b> — мой личный опыт и лайфхаки, которых нет в инструкциях к приложениям.</p></div></div>\n    <div class=\"card\"><div class=\"row\"><span class=\"pill red\" style=\"padding:3px 8px\">!</span><p class=\"small\"><b>Красная рамка</b> — ловушка или частая ошибка. Читай обязательно.</p></div></div>\n    <div class=\"card\"><div class=\"row\"><span class=\"cn\" style=\"font-size:17px;font-weight:900;line-height:1\">你好</span><p class=\"small\">Ко всем китайским словам есть запись русскими буквами: <b>ни хао</b>. Не поняли — просто покажи иероглифы на экране.</p></div></div>\n  </div>\n\n  <div class=\"note ink\" style=\"margin-top:18px\"><span class=\"t\">главное правило</span>\n    <p style=\"font-size:13.6px\"><b>Всё настраивается дома, а не в аэропорту.</b> Без интернета и рабочей оплаты в Китае ты не купишь даже воду. Отложи на подготовку два вечера — и первый день пройдёт спокойно.</p>\n  </div>\n  \n","3":"\n  \n  <div class=\"kick\">если прочитаешь одну страницу</div>\n  <h1>10 правил <span class=\"r\">первого дня</span></h1>\n  <p class=\"lead\">Выжимка всего гайда. Сфотографируй — и держи в телефоне.</p>\n  <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:14px\">\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">01</span><p><b>Alipay с пройденной верификацией — до вылета.</b> Проверка паспорта занимает до 3 дней. Без неё платежи не проходят. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-11\">стр. 11–16</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">02</span><p><b>Интернет решён дома:</b> eSIM или роуминг. Через китайский Wi-Fi не откроются Telegram, WhatsApp и Google. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-19\">стр. 19–20</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">03</span><p><b>2 000–3 000 ¥ наличными мелкими.</b> Страховка на случай, если приложение вдруг не пропустит оплату. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-10\">стр. 10</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">04</span><p><b>Карточка прибытия — онлайн и бесплатно.</b> Сайты, которые просят за неё деньги, — мошенники. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-8\">стр. 8</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">05</span><p><b>Адрес отеля иероглифами</b> — скрином в галерее и на бумаге. Это твой билет домой из любой точки. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-40\">стр. 40</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">06</span><p><b>Первая покупка в аэропорту — вода за 3 ¥ через Alipay.</b> Прошло — оплата работает. Нет — сразу в план Б. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-28\">стр. 28</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">07</span><p><b>Такси — только официальная очередь или DiDi.</b> Тем, кто сам подходит в зале прилёта, говори <b>бу яо</b> и иди дальше. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-30\">стр. 30</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">08</span><p><b>Сумму при оплате по QR продавца вводишь ты.</b> Проверь дважды: 28 и 280 в спешке путают все. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-15\">стр. 15</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">09</span><p><b>Три отказа оплаты подряд — остановись.</b> Дальше Alipay может временно заморозить аккаунт. Плати наличными и разбирайся спокойно. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-42\">стр. 42</a></span></p></div>\n    <div class=\"card\" style=\"display:flex;gap:12px;align-items:center;padding:10px 14px\"><span style=\"font-family:var(--dela);font-weight:900;font-size:22px;color:var(--red);width:34px\">10</span><p><b>Воду из-под крана не пьём, острое заказываем осторожно:</b> <span class=\"cn\">微辣</span> «вэй ла» — чуть-чуть, <span class=\"cn\">不辣</span> «бу ла» — совсем без. <span class=\"mute\">→ <a class=\"pl\" href=\"#p-33\">стр. 33–34</a></span></p></div>\n  </div>\n<div class=\"kris\"><div class=\"ava\"><img src=\"@IMG@kris.jpg\" alt=\"\"></div><div class=\"bub\"><div class=\"h\">Крис советует</div><p class=\"small\">Отправь эту страницу попутчику или родителям — так близкие будут понимать, что ты делаешь, и меньше волноваться. И перечитай её в самолёте.</p></div></div>\n  \n"};

  const close=()=>{d.remove();try{wake&&wake.release()}catch(e){}};
  d.querySelector('.x').onclick=close;d.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  document.body.appendChild(d);d.querySelector('.x').focus();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LAT={'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y'};
function norm(s){const t=s.toUpperCase().replace(/[А-ЯЁ]/g,c=>LAT[c]||c).replace(/[^A-Z0-9]/g,'');return t.length===10?t.slice(0,2)+'-'+t.slice(2,6)+'-'+t.slice(6):t}
function devId(){let d=store.get('dev',null);if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set('dev',d)}return d}
async function decrypt(hex){
  const raw=b64(BLOB),key=await crypto.subtle.importKey('raw',Uint8Array.from(hex.match(/../g).map(h=>parseInt(h,16))),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
async function openCode(code){
  const c=norm(code);if(!/^KT-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c))return {msg:'Код выглядит так: KT-XXXX-XXXX. Проверь буквы и цифры.'};
  if(!API)return {msg:'Вход по коду ещё не подключён. Напиши Крис.'};
  let r;try{r=await (await fetch(API+'?code='+encodeURIComponent(c)+'&dev='+devId())).json()}catch(e){return {msg:'Нет связи с сервером. Проверь интернет — в Китае без VPN вход может не пройти, открой гайд дома.'}}
  if(!r.ok)return {msg:r.msg||'Код не подошёл. Напиши Крис.'};
  BODY=await decrypt(r.key);store.set('key',r.key);return {ok:1};
}

   <p class="s">Что настроить дома и что делать с трапа до ужина. Работает без интернета.</p><img src="${IMGB}kris-cut.webp" alt=""></div>
  ${BODY?'':lockBox()}
  ${last&&byN(last)&&open(last)?`<div class="sec2"><a class="btn" href="#p-${last}">Продолжить: ${esc(byN(last).t)}</a></div>`:''}
  <div class="srch">🔎<input id="q" type="search" placeholder="Поиск: Alipay, такси, вода…" value="${esc(q)}" aria-label="Поиск по гайду"></div>
  <div id="res"></div>
  <div class="quick">
   <a href="#p-40"><i>🪧</i>Карточки «покажи»</a><a href="#p-38"><i>🗣</i>30 фраз</a><a href="#p-44"><i>✉️</i>Сообщения отелю</a>
   <a href="#p-26"><i>✅</i>Чек-лист</a><a href="#p-42"><i>🆘</i>Если что-то сломалось</a><a href="#p-28"><i>🛬</i>Первые 2 часа</a></div>
  ${parts.map(pt=>`<div class="part"><h3>${esc(pt)}</h3><div class="list">${PAGES.filter(p=>p.p===pt).map(p=>{
     const o=open(p.n);return `<a href="#p-${p.n}" class="${o?(read[p.n]?'rd':''):'lk'}"><span class="no">${ICON[p.n]||''}</span><span><b>${esc(p.t)}</b>${p.k?`<em>${esc(p.k)}</em>`:''}</span><span class="st">${o?(read[p.n]?'✓':'›'):'🔒'}</span></a>`}).join('')}</div></div>`).join('')}
  <div class="foot">Прочитано ${done} из ${PAGES.length} · версия от ${esc(VERSION)} · обновления бесплатно<br>
   Вопросы — <a href="${CH}" target="_blank" rel="noopener">t.me/chinawithkris</a>${BODY?'':`<br><br>Бесплатно открыты «Привет» и «10 правил первого дня»`}</div></div>`;
  const qi=$('#q');qi.oninput=()=>{store.set('q',qi.value);search(qi.value)};if(q)search(q);
  const f=$('#code');if(f){$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent='Проверяю…';const r=await openCode(f.value);if(r.ok){toast('Готово, гайд открыт');home()}else{$('#err').textContent=r.msg;b.disabled=false;b.textContent='Открыть гайд'}};f.onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}
  document.title='Китай: первые 24 часа';
}
function lockBox(){
  return `<div class="lockbox"><h2>Открыть весь гайд</h2><p>42 главы: Alipay и WeChat по шагам, eSIM, аэропорт, такси, еда, фразы, карточки и бонусы. Плюс PDF для печати.</p>
  <div class="price"><b>${PRICE}</b><span class="mute small">один раз · 3 устройства · без интернета</span></div>
  <a class="btn" href="${BOT}" target="_blank" rel="noopener">Купить в боте</a>
  <p style="margin:16px 0 8px"><b>Уже есть код?</b> Введи его — лучше дома, до вылета.</p>
  <input id="code" autocomplete="off" autocapitalize="characters" placeholder="KT-XXXX-XXXX" aria-label="Код доступа">
  <div class="err" id="err" role="alert"></div><button class="btn o" id="go">Открыть гайд</button></div>`;
}
function search(q){
  const box=$('#res');q=q.trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return}
  const hits=[];
  for(const p of PAGES){const h=html(p.n);if(!h&&!p.t.toLowerCase().includes(q))continue;
    const t=(p.t+' '+h.replace(/<[^>]+>/g,' ')).replace(/\s+/g,' '),i=t.toLowerCase().indexOf(q);if(i<0)continue;
    const a=Math.max(0,i-50),snip=esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,i+q.length+70));
    hits.push(`<a class="hit" href="#p-${p.n}"><b>${esc(p.t)}${open(p.n)?'':' 🔒'}</b><span>${a?'…':''}${snip}…</span></a>`)}
  box.innerHTML=`<div class="part" style="padding-top:12px"><h3>Найдено: ${hits.length}</h3><div class="list">${hits.join('')||'<div class="hit"><span>Ничего не нашлось. Попробуй другое слово.</span></div>'}</div></div>`;
}

/* ---------- глава ---------- */
function chapter(n){
  const p=byN(n);if(!p)return home();
  if(!open(n)){toast('Эта глава откроется после покупки');location.hash='';return}
  const i=idx(n),prev=PAGES[i-1],next=PAGES[i+1];
  app.innerHTML=`<div class="topbar"><a class="ib" href="#" aria-label="К списку глав">☰</a><div class="ttl">${esc(p.t)}<small>${esc(p.p)} · ${i+1} из ${PAGES.length}</small></div><a class="ib" href="#" aria-label="Поиск" data-q>🔎</a></div>
  <div class="prog"><i style="width:${Math.round((i+1)/PAGES.length*100)}%"></i></div>
  <div class="wrap"><section class="page ${esc(p.cls)}" id="pg">${html(n)}</section>
  <div class="pager">${prev?`<a href="#p-${prev.n}">‹ Назад<small>${esc(prev.t)}</small></a>`:'<span style="flex:1"></span>'}${next?(open(next.n)?`<a class="nx" href="#p-${next.n}">Дальше ›<small>${esc(next.t)}</small></a>`:`<a class="nx" href="#">Открыть весь гайд ›<small>${PRICE}</small></a>`):`<a class="nx" href="#">К списку глав ›<small>все главы</small></a>`}</div></div>`;
  enhance($('#pg'),n);
  const read=store.get('read',{});read[n]=1;store.set('read',read);store.set('last',n);
  document.title=p.t+' — 24 часа';window.scrollTo(0,0);
  $('[data-q]').onclick=e=>{e.preventDefault();location.hash='';setTimeout(()=>{const q=$('#q');q&&q.focus()},50)};
}
const txt=el=>el?el.textContent.replace(/\s+/g,' ').trim():'';
function enhance(pg,n){
  // таблицы — горизонтальная прокрутка, широкие не сжимаются
  $$('table',pg).forEach(t=>{const w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t);
    const cols=Math.max(...[...t.rows].map(r=>r.cells.length));if(cols>=4&&!t.classList.contains('ph-t'))t.classList.add('wide')});
  // строки с иероглифами: сообщения — копировать, остальное — на весь экран
  $$('tr',pg).forEach(tr=>{const cells=[...tr.cells],cnEl=tr.querySelector('td .cn');if(!cnEl||tr.querySelector('.grp'))return;
    if(cells.length===2&&cells[1].contains(cnEl)){tr.classList.add('copy');tr.onclick=()=>copy(txt(cnEl));return}
    if(cnEl.parentElement.firstElementChild!==cnEl)return;
    tr.classList.add('tap');tr.onclick=()=>{const ru=tr.querySelector('.ru');const py=ru?txt(ru.firstChild&&ru.firstChild.nodeType===3?{textContent:ru.firstChild.textContent}:ru):'';
      full({cn:txt(cnEl),py,ru:txt(cells[cells.length-1])===txt(cnEl)?'':txt(cells[cells.length-1])})}});
  // карточки «покажи» и вывески
  $$('.show',pg).forEach(c=>{if(c.querySelector('.blank')){addrCard(c);return}
    c.onclick=()=>{const cn=$$('.cn',c).map(txt).join('\n');const lab=txt($('.for',c));const tr=$$('.tr',c).map(txt).join(' ');
      const py=[...c.children].filter(x=>!x.classList.contains('cn')&&!x.classList.contains('tr')&&!x.classList.contains('for')&&x.tagName==='DIV').map(txt).join(' ');
      full({cn,lab,py,ru:tr})}});
  // остальные иероглифы в тексте — тоже на весь экран
  $$('.cn',pg).forEach(el=>{if(el.closest('.show,tr.tap,tr.copy,.pill,.ph,.scr,h1,.ic,.addr')||el.onclick)return;const t=txt(el);if(!/[一-鿿]/.test(t)||t.length>40)return;
    el.classList.add('tap');el.onclick=e=>{e.stopPropagation();const nx=el.nextSibling&&el.nextSibling.textContent||'';const m=nx.match(/«([^»]+)»/);full({cn:t,py:m?m[1]:''})}});
  // чек-листы с галочками
  const ck=store.get('ck'+n,{});
  $$('.ck li',pg).forEach((li,k)=>{if(ck[k])li.classList.add('on');li.onclick=()=>{li.classList.toggle('on');ck[k]=li.classList.contains('on')?1:0;store.set('ck'+n,ck)}});
  // внешние ссылки — в новой вкладке
  $$('a[href^="http"]',pg).forEach(a=>{a.target='_blank';a.rel='noopener'});
}
function addrCard(c){
  const v=store.get('hotel',{n:'',a:'',t:''});
  const grid=[...c.children].find(x=>x.querySelector&&x.querySelector('.blank'));
  const form=document.createElement('div');form.className='addr';
  form.innerHTML=`<label>Название отеля иероглифами<input id="hn" lang="zh-Hans" placeholder="锦江饭店" value="${esc(v.n)}"></label>
   <label>Адрес иероглифами — из брони на Trip.com<textarea id="ha" rows="2" lang="zh-Hans" placeholder="上海市黄浦区茂名南路59号">${esc(v.a)}</textarea></label>
   <label>Телефон отеля<input id="ht" inputmode="tel" placeholder="+86 21 …" value="${esc(v.t)}"></label>
   <button class="btn" id="hs">Показать таксисту</button>`;
  if(grid)grid.replaceWith(form);else c.appendChild(form);
  c.style.cursor='default';
  const save=()=>store.set('hotel',{n:$('#hn').value,a:$('#ha').value,t:$('#ht').value});
  $$('input,textarea',form).forEach(i=>i.oninput=save);
  $('#hs').onclick=()=>{const n=$('#hn').value.trim(),a=$('#ha').value.trim(),t=$('#ht').value.trim();
    if(!n&&!a){toast('Сначала впиши адрес отеля');$('#ha').focus();return}
    full({lab:'для таксиста',cn:'请带我去这个地址\n'+[n,a].filter(Boolean).join('\n')+(t?'\n电话 '+t:''),ru:'Пожалуйста, отвезите меня по этому адресу'})};
}

/* ---------- маршрутизация ---------- */
function route(){const m=location.hash.match(/^#p-(\d+)/);if(m){const n=+m[1];if(byN(n))return chapter(n);const alt=PAGES.find(p=>p.n>n);return alt?chapter(alt.n):home()}home()}
window.addEventListener('hashchange',route);
(async function boot(){
  if(PREVIEW)BODY=PREVIEW;
  else{const k=store.get('key',null);if(k&&BLOB){try{BODY=await decrypt(k)}catch(e){store.set('key',null)}}}
  route();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
