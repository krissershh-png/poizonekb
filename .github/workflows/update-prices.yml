name: Цены и наличие Poizon

on:
  schedule:
    - cron: '0 3,9,15 * * *'   # три раза в день: 08:00, 14:00 и 20:00 по Екатеринбургу
  workflow_dispatch:       # кнопка «Run workflow» для запуска вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить prices.json
        shell: pwsh
        run: ./update-prices.ps1
      - name: Сохранить изменения
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Цены и наличие Poizon на $(date +%d.%m)"
          git push
