name: Цены и наличие Poizon

on:
  schedule:
    - cron: '0 3,9,15 * * *'   # три раза в день: 08:00, 14:00 и 20:00 по Екатеринбургу
  workflow_dispatch:       # кнопка «Run workflow» для запуска вручную

permissions:
  contents: write

# два обновления цен одновременно не идут
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить prices.json
        shell: pwsh
        run: ./update-prices.ps1
      - name: Сохранить изменения
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Цены и наличие Poizon на $(date +%d.%m)"
          # цены собираются несколько минут: если за это время на сайт что-то выложили, подтягиваем свежую версию и отправляем снова
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
